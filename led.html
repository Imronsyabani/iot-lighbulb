<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="layouts">
        <section class="navbar">
            <h3>IOT</h3>
        </section>
        <section class="page-title">
            <h3>Light Control</h3>
        </section>
        <section class="leds">
            <div class="led">
                <img src="assets/led-off.png" alt="LED ON" class="led-image" id="ledImageDapur">
                <p class="led-location-text">Dapur</p>
                <button class="led-submit" id="ledDapur" onclick="setDapurLed()">Turn On</button>
            </div>
            <div class="led">
                <img src="assets/led-off.png" alt="LED ON" class="led-image" id="ledImageKamar">
                <p class="led-location-text">Kamar</p>
                <button class="led-submit" id="ledKamar" onclick="setKamarLed()">Turn On</button>
            </div>
            <div class="led">
                <img src="assets/led-off.png" alt="LED ON" class="led-image" id="ledImageTamu">
                <p class="led-location-text">Ruang Tamu</p>
                <button class="led-submit" id="ledTamu" onclick="setTamuLed()">Turn On</button>
            </div>
            <div class="led">
                <img src="assets/led-off.png" alt="LED ON" class="led-image" id="ledImageTeras">
                <p class="led-location-text">Teras</p>
                <button class="led-submit" id="ledTeras" onclick="setTerasLed()">Turn On</button>
            </div>
        </section>
        <section class="bottombar">
            <ul>
                <li><a href="/"><i class="fa-solid fa-home"></i></a></li>
                <li><a href="led.html"><i class="fa-solid fa-lightbulb"></i></a></li>
                <li><a href="#"><i class="fa-solid fa-fan"></i></a></li>
                <li><a href="#"><i class="fa-solid fa-user"></i></a></li>
            </ul>
        </section>
    </div>
    <script src="main.js"></script>
</body>
</html>
